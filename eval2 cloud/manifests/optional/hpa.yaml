# OPTIONAL EXTENSION - not part of the recorded results.
# Horizontal Pod Autoscaler: adds php-apache replicas when average CPU
# (as reported by Metrics Server) goes above 50% of the pod's CPU *request*.
#   kubectl apply -f manifests/optional/hpa.yaml
#   kubectl get hpa php-apache -w
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
