# Declarative equivalent of the command used during the experiment:
#   kubectl run load-generator --image=busybox:1.28 --restart=Never -it --rm -- \
#     /bin/sh -c "while true; do wget -q -O- http://php-apache; done"
# It sends HTTP requests to the php-apache Service in an endless loop.
# Delete it to stop the load:  kubectl delete pod load-generator
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  labels:
    run: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load-generator
      image: busybox:1.28
      command: ["/bin/sh", "-c", "while true; do wget -q -O- http://php-apache; done"]
